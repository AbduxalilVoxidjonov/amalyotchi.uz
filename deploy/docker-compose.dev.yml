# LOKAL DEMO / STEND override — production'da ISHLATMANG.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d --build
#   (+ Cloudflare Tunnel ham kerak bo'lsa: ... --profile tunnel up -d --build)
#
# Asosiy fayldagi majburiy o'zgaruvchilar (JWT_SIGNING_KEY, POSTGRES_PASSWORD, ADMIN_*, *_PUBLIC_URL,
# SEQ_ADMIN_PASSWORD, CLOUDFLARE_TUNNEL_TOKEN) bu yerda ham deploy/.env da bo'lishi kerak — compose ularni
# birlashtirishdan OLDIN tekshiradi. Lokal uchun soxta qiymatlar yetarli (README "Lokal demo").
#
# Farqlar: demo seed default yoqiq, barcha servislar 127.0.0.1 portlarida, Seq autentifikatsiyasiz,
# CORS'ga Vite dev server qo'shilgan, cloudflared faqat `--profile tunnel` bilan.

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"   # DBeaver/psql: 127.0.0.1:55432 (5432 odatda band)

  seq:
    environment:
      SEQ_FIRSTRUN_ADMINPASSWORD: !reset null
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"

  api:
    environment:
      # Production'dagi fail-fast tekshiruv (ProductionConfigValidator: demo seed, zaif parollar) faqat
      # "Production" nomida ishlaydi — demo stend Staging sifatida ko'tariladi.
      ASPNETCORE_ENVIRONMENT: Staging
      Seed__Demo: ${SEED_DEMO:-true}
      # Lokal portlar orqali Host = 127.0.0.1 — .env dagi production API_ALLOWED_HOSTS bu yerda 400 berardi.
      AllowedHosts: "*"
      # Brauzerdan to'g'ridan-to'g'ri :5080 ga (Vite dev server) va lokal host portlari orqali murojaat uchun.
      Cors__Origins__2: ${CORS_ORIGIN:-http://127.0.0.1:5173}
      Cors__Origins__3: http://127.0.0.1:${DASHBOARD_PORT:-8090}
      Cors__Origins__4: http://127.0.0.1:${TWA_PORT:-8091}
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"         # http://127.0.0.1:5080/health

  dashboard:
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8090}:80"     # http://127.0.0.1:8090

  twa:
    ports:
      - "127.0.0.1:${TWA_PORT:-8091}:80"           # http://127.0.0.1:8091

  cloudflared:
    profiles: ["tunnel"]

  # Lokal stendda kunlik zaxira shart emas — kerak bo'lsa: --profile backup
  backup:
    profiles: ["backup"]
