# Amaliyotchi TWA — nginx shabloni (image ichida: /etc/nginx/templates/twa.conf.template →
# start'da envsubst → /etc/nginx/conf.d/twa.conf, http kontekstiga include bo'ladi).
# Faqat NGINX_REAL_IP_FROM almashtiriladi (Dockerfile: NGINX_ENVSUBST_FILTER) — nginx'ning $o'zgaruvchilari tegilmaydi.
# SPA + `/api/` → API konteyneri (compose: `api`, port 8080).

# Cache-Control: Vite hash'li /assets/ — abadiy; index.html va boshqalar — no-cache; /api/ — API o'zi boshqaradi.
map $uri $twa_cache_control {
    ~^/assets/   "public, max-age=31536000, immutable";
    ~^/api/      "";
    default      "no-cache";
}

# --- Haqiqiy klient IP / sxema (Brauzer → Cloudflare → cloudflared → shu nginx → API) ---
# NGINX_REAL_IP_FROM (env) — image entrypoint'i (envsubst, /etc/nginx/templates) start'da qo'yadi;
# compose: cloudflared'ning qat'iy IP si (CLOUDFLARED_IP/32); Dockerfile standarti 172.30.0.0/16 (compose'siz).
# Ishonch faqat shu tarmoqdagi manbaga: cloudflared konteyneri. CF-Connecting-IP ni Cloudflare edge
# qo'yadi (klient yuborgani ustidan yozadi). Boshqa manbadan kelgan CF-Connecting-IP / X-Forwarded-Proto
# e'tiborsiz qoldiriladi. Eslatma: host'dagi 127.0.0.1:PORT ulanishlari ham shu tarmoq gateway'i
# (x.x.0.1) orqali keladi — ya'ni host'ning o'zidagi lokal foydalanuvchi sarlavhani soxtalashtira oladi;
# bu API'ning 127.0.0.1:5080 porti bilan bir xil ishonch darajasi (tashqi tarmoqqa ochiq emas).
#
# $realip_remote_addr — real_ip almashtirishidan OLDINGI haqiqiy TCP manba (proksi manzili).
geo $realip_remote_addr $from_trusted_proxy {
    default                 0;
    ${NGINX_REAL_IP_FROM}   1;
}

# Ishonchli proksidan kelgan `http`/`https` qabul qilinadi (cloudflared → `https`); aks holda
# nginx'ning o'z sxemasi. Boshqa qiymatlar (bo'sh, soxta) — $scheme.
map "$from_trusted_proxy:$http_x_forwarded_proto" $fwd_proto {
    "~^1:(?<fwd_p>https?)$"   $fwd_p;
    default                   $scheme;
}

# HSTS faqat HTTPS orqali kelgan so'rovga (brauzer HTTP javobdagi HSTS'ni baribir e'tiborsiz qoldiradi,
# lokal http://127.0.0.1:PORT ga ta'sir qilmaydi). includeSubDomains/preload YO'Q — boshqa subdomenlar
# HTTPS'ga majburlanmaydi. Bo'sh qiymat → add_header sarlavhani umuman yubormaydi.
map $fwd_proto $hsts_header {
    https    "max-age=31536000";
    default  "";
}

# Access log: $remote_addr — real_ip'dan keyin HAQIQIY klient IP; proxy= — TCP manba (cloudflared).
log_format amaliyotchi '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" proxy=$realip_remote_addr proto=$fwd_proto '
                       'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # Klient IP: faqat ishonchli proksi (yuqoridagi geo bilan bir xil subnet) yuborgan CF-Connecting-IP.
    # Sarlavhada bitta IP bo'ladi — real_ip_recursive kerak emas.
    set_real_ip_from ${NGINX_REAL_IP_FROM};
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/access.log amaliyotchi;

    # Kundalik yozuvi multipart (fayllar) — 30 MB gacha; proxy'da buferlanmay to'g'ridan-to'g'ri API'ga oqadi.
    client_max_body_size 32m;

    # --- gzip (matnli javoblar) ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/manifest+json
        image/svg+xml font/woff2;

    # --- Sarlavhalar (server darajasida bitta joyda: location'da add_header ishlatilsa meros uziladi) ---
    add_header Cache-Control $twa_cache_control always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Check-in: GPS (geolocation), selfi va QR skaner (camera) — faqat o'z origin'imizga ruxsat.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    # Telegram Web App: Telegram klientlari (web.telegram.org / *.telegram.org) ilovani iframe ichida ochadi —
    # frame-ancestors shunga ochiq; X-Frame-Options qo'yilmaydi (allow-list'ni qo'llamaydi).
    # telegram-web-app.js @twa-dev/sdk bundle ichida — tashqi skript yo'q. frame-src: SDK openTelegramLink fallback iframe'i.
    # Google Fonts (index.html) uchun style/font manbalari ochiq.
    # Cloudflare Web Analytics: proksi sahifaga beacon.min.js qo'shadi (script-src) va natijani
    # cloudflareinsights.com ga yuboradi (connect-src) — aks holda CSP bloklaydi, konsolda xato.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cloudflareinsights.com; frame-src https://t.me https://*.telegram.org; frame-ancestors https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # --- Healthcheck (Docker HEALTHCHECK / compose) ---
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Client diagnostika beacon'i (shared/lib/diag.ts) ---
    # Ma'lumot query'da — access log'ga yoziladi; API'ga bormaydi. 204 muhim: Telegram Android WebView
    # har qanday 4xx javobida (subresource ham) "Oops! Failed to load" ko'rsatadi.
    location = /api/__diag {
        return 204;
    }

    # --- API proxy ---
    # `resolver` + o'zgaruvchi: nginx `api` nomini start'da emas, so'rov vaqtida hal qiladi —
    # API konteyneri hali ko'tarilmagan bo'lsa ham nginx yiqilmaydi (so'rov 502 oladi).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_upstream api;
        proxy_pass http://$api_upstream:8080;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # $remote_addr — real_ip'dan keyingi haqiqiy klient IP. X-Forwarded-For ga ZANJIR emas, bitta qiymat:
        # klient yuborgan X-Forwarded-For tashlab yuboriladi (API ForwardLimit=1 + KnownProxies — oxirgi
        # qiymatni faqat nginx konteyneridan qabul qiladi). Rate limit va audit log shu IP'ga tayanadi.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        # API'ga kerak emas — upstream'ga soxta nusxa o'tmasin.
        proxy_set_header CF-Connecting-IP "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    # --- Statik (Vite hash'li fayllar) ---
    location /assets/ {
        try_files $uri =404;
    }

    # Source map'lar image'da yo'q (build'da o'chiriladi); ehtiyot uchun baribir yopiq.
    location ~ \.map$ {
        return 404;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri /index.html;
    }
}
