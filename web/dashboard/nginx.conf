# Amaliyotchi dashboard — nginx (image ichida: /etc/nginx/conf.d/dashboard.conf, http kontekstiga include bo'ladi).
# SPA + `/api/` → API konteyneri (compose: `api`, port 8080).

# Cache-Control: Vite hash'li /assets/ — abadiy; index.html va boshqalar — no-cache; /api/ — API o'zi boshqaradi.
map $uri $dash_cache_control {
    ~^/assets/   "public, max-age=31536000, immutable";
    ~^/api/      "";
    default      "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # Kundalik yozuvi multipart (fayllar) — 30 MB gacha; proxy'da buferlanmay to'g'ridan-to'g'ri API'ga oqadi.
    client_max_body_size 32m;

    # --- gzip (matnli javoblar) ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/manifest+json
        image/svg+xml font/woff2;

    # --- Sarlavhalar (server darajasida bitta joyda: location'da add_header ishlatilsa meros uziladi) ---
    add_header Cache-Control $dash_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Google Fonts (index.html) uchun style/font manbalari ochiq; skript faqat o'zimizniki.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # --- Healthcheck (Docker HEALTHCHECK / compose) ---
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API proxy ---
    # `resolver` + o'zgaruvchi: nginx `api` nomini start'da emas, so'rov vaqtida hal qiladi —
    # API konteyneri hali ko'tarilmagan bo'lsa ham nginx yiqilmaydi (so'rov 502 oladi).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_upstream api;
        proxy_pass http://$api_upstream:8080;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    # --- Statik (Vite hash'li fayllar) ---
    location /assets/ {
        try_files $uri =404;
    }

    # Source map'lar image'da yo'q (build'da o'chiriladi); ehtiyot uchun baribir yopiq.
    location ~ \.map$ {
        return 404;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri /index.html;
    }
}
